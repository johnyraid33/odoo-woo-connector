# Dev-only HTTPS vhost for the WordPress container.
#
# WooCommerce only performs HTTP Basic authentication for SSL requests
# (WC_REST_Authentication::authenticate() checks is_ssl()), and the Odoo
# connector authenticates with Basic auth (consumer_key:consumer_secret).
# Without TLS every authenticated REST call is answered with HTTP 401, so the
# verification stack exposes a self-signed HTTPS endpoint on host port 8443.
#
# The certificate is generated by scripts/gen-cert.sh into dev/certs/.

Listen 443 https

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/dev-certs/server.crt
    SSLCertificateKeyFile /etc/apache2/dev-certs/server.key

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
