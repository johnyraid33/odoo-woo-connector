[options]
; Odoo 20 dev configuration for the woocommerce_connector verification stack.
; Database connection parameters are intentionally NOT set here: the official
; odoo:20.0 entrypoint passes them as --db_* flags from HOST/PORT/USER/PASSWORD
; env vars in docker-compose.yml, which keeps credentials in one place.
;
; Base Odoo addons + the module under test:
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
http_interface = 0.0.0.0
http_port = 8069
; Password for the /web/database/manager UI:
admin_passwd = admin
list_db = True
log_level = info
logfile = None
workers = 0
; Relaxed limits: a dev machine, not production.
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200
max_cron_threads = 1
proxy_mode = True
