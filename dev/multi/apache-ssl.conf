# Dev-only HTTPS vhost for the SECOND (multi-store) WordPress container.
#
# WooCommerce only performs HTTP Basic authentication for SSL requests
# (WC_REST_Authentication::authenticate() checks is_ssl()), so the REST API has
# to be served over TLS. This vhost terminates the self-signed certificate
# generated by scripts/gen-cert.sh, whose SAN covers BOTH:
#   * localhost            -> host-side curl / browser checks
#   * wordpress-multi      -> the DNS name the Odoo container of the MAIN stack
#                             uses (docker network odoo-woo-connector-dev_default)
#   * odoo-woo-connector-multi-wordpress-multi-1 -> compose container name
#
# NB: no "Listen 443" here — ports.conf already adds it when ssl_module is
# loaded (a2enmod ssl is done by scripts/wp-entrypoint.sh).

<VirtualHost *:443>
    ServerName wordpress-multi
    ServerAlias localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/multi-certs/server.crt
    SSLCertificateKeyFile /etc/apache2/multi-certs/server.key

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
