# Reproducible local verification stack for the rex_woocommerce_connector Odoo module.
#
#   WordPress 7.x + WooCommerce 11.2.2 + MySQL 8.0   -> http://localhost:${WP_PORT:-8091}
#                                                      https://localhost:${WP_HTTPS_PORT:-8443} (REST API)
#   Odoo 20 + PostgreSQL 17                         -> http://localhost:${ODOO_PORT:-8090}
#
# WooCommerce performs HTTP Basic authentication only over SSL, so the WordPress
# container also serves HTTPS on ${WP_HTTPS_PORT:-8443} (self-signed cert generated
# by dev.sh up / scripts/gen-cert.sh). The Odoo container trusts that certificate
# via REQUESTS_CA_BUNDLE.
#
# Everything is driven by ./dev.sh (up | down | reset | seed | creds | status).
# Host ports / passwords can be overridden in dev/.env (see .env.example).

name: odoo-woo-connector-dev

services:
  # ------------------------------------------------------------------ MySQL
  # Database for WordPress/WooCommerce.
  db:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=64M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Exposed on loopback only, for debugging. Not required by the stack.
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # -------------------------------------------------------------- WordPress
  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', '/var/www/html/wp-content/debug.log');
        define('WP_DEBUG_DISPLAY', false);
        // The image runs apache as www-data and owns the volume, so no FTP dance.
        define('FS_METHOD', 'direct');
        // Allow the connector's dev setup to see real HTTP errors.
        define('WP_ENVIRONMENT_TYPE', 'local');
    # Wrapper that enables Apache mod_ssl (off in the upstream image) and then
    # hands over to the image's own entrypoint.
    entrypoint: ["/opt/scripts/wp-entrypoint.sh"]
    volumes:
      - wordpress_data:/var/www/html
      - ./scripts:/opt/scripts:ro
      - ./apache-ssl.conf:/etc/apache2/conf-enabled/zz-dev-ssl.conf:ro
      - ./certs:/etc/apache2/dev-certs:ro
    ports:
      - "${WP_PORT:-8091}:80"
      # Loopback only: self-signed HTTPS endpoint for WooCommerce REST auth.
      - "127.0.0.1:${WP_HTTPS_PORT:-8443}:443"

  # ------------------------------------------------------------- WP-CLI/seed
  # Automation container (wp-cli). Kept alive with `tail` so that
  # `docker compose exec wpcli wp ...` works after `dev.sh up`.
  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      wordpress:
        condition: service_started
    # The apache image's www-data is uid 33; the alpine cli image's is 82.
    # Run as 33 so files written by wp-cli stay owned by the same user as
    # the files apache writes into the shared volume.
    user: "33:33"
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WP_CLI_ALLOW_ROOT: "1"
      # wp-config.php is generated by the wordpress image from these env vars,
      # so the CLI container must see the same values.
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      # Written as "base_url" into dev/.woo_credentials.json. Uses the HTTPS
      # endpoint because Basic auth is rejected over plain HTTP.
      WOO_API_BASE_URL: https://localhost:${WP_HTTPS_PORT:-8443}
    volumes:
      - wordpress_data:/var/www/html
      - ./scripts:/opt/scripts:ro

  # --------------------------------------------------------- PostgreSQL/Odoo
  odoo-db:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${ODOO_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  odoo:
    image: odoo:20.0
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      # The official entrypoint turns these into --db_* CLI flags for the
      # server process, so the running server always talks to odoo-db.
      HOST: odoo-db
      PORT: "5432"
      USER: odoo
      PASSWORD: odoo
      # Trust the stack's self-signed certificate when the module calls the store.
      # requests honours REQUESTS_CA_BUNDLE, so no code change is needed in Odoo.
      REQUESTS_CA_BUNDLE: /mnt/dev-certs/server.crt
    volumes:
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - ./certs:/mnt/dev-certs:ro
      - odoo_data:/var/lib/odoo
      # The module under test. Read-write so Odoo can write __pycache__.
      - ../rex_woocommerce_connector:/mnt/extra-addons/rex_woocommerce_connector
    ports:
      - "${ODOO_PORT:-8090}:8069"
    extra_hosts:
      # The store builds absolute image URLs from its public address
      # (http://localhost:8092). Inside the Odoo container that name has to
      # resolve to the host, otherwise image import cannot be verified locally.
      - "localhost:host-gateway"

volumes:
  mysql_data:
  wordpress_data:
  odoo_pg_data:
  odoo_data:
