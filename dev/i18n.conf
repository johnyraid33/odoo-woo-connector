# Odoo configuration used only by the translation export command in
# TRANSLATING.md. It points at the development database of the docker stack.
[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
db_host = odoo-db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = woo_dev
